[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "enterprise-agent-work-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3", "fastapi>=0.115,<1", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2", "temporalio>=1.9,<2", "redis>=5,<7", "minio>=7.2,<8", "httpx>=0.28,<1", "cryptography>=44", "mcp>=1.9,<2", "pgvector>=0.3,<1", "pyyaml>=6,<7", "jsonschema>=4,<5", "packaging>=24", "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2", "prometheus-client>=0.21,<1", "pypdf>=6,<7", "python-docx>=1.2,<2", "python-pptx>=1.0,<2", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "types-jsonschema", "types-openpyxl>=3.1,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
