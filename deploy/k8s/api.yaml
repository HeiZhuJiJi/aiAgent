apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-agent-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-agent-api
  template:
    metadata:
      labels:
        app: enterprise-agent-api
    spec:
      containers:
        - name: api
          image: enterprise-agent-backend
          command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8080"]
          envFrom:
            - configMapRef:
                name: enterprise-agent-config
            - secretRef:
                name: enterprise-agent-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: enterprise-agent-api
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-agent-api
spec:
  selector:
    app: enterprise-agent-api
  ports:
    - name: http
      port: 8080
      targetPort: http
